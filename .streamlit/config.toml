# Streamlit server config — local dev / Streamlit Community Cloud
[server]
address = "0.0.0.0"
port = 8501
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
primaryColor = "#7A9E7E"
backgroundColor = "#F7F5F2"
secondaryBackgroundColor = "#EFEDE9"
textColor = "#2F3432"
font = "sans serif"
